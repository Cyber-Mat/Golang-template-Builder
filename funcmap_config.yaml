functions:
  - name: lookupUser
    description: "Fetch user display name by ID"
    args:
      - name: userID
        type: string
    returns: string
    category: lookup
    block:
      shape: reporter
      color: "#4CAF50"

  - name: formatDate
    description: "Format a date string"
    args:
      - name: date
        type: string
      - name: layout
        type: string
    returns: string
    category: formatting
    block:
      shape: reporter
      color: "#4CAF50"

  - name: sortBy
    description: "Sort a slice by a struct field name"
    args:
      - name: items
        type: any
      - name: field
        type: string
    returns: any
    category: list
    block:
      shape: reporter
      color: "#4CAF50"
